name: OmniCommerce AI OS - CI & GitHub Pages Deploy

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  # 1. Rust Backend Test & Quality Check
  backend-check:
    name: Rust Backend Compilation & Quality
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Rust Toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Rust Cache
        uses: Swatinem/rust-cache@v2

      - name: Check Workspace Crates
        run: cargo check --workspace

  # 2. Deploy Interactive Command Center to GitHub Pages
  deploy-pages:
    name: Deploy Live Web Command Center to GitHub Pages
    runs-on: ubuntu-latest
    needs: backend-check
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup GitHub Pages
        uses: actions/configure-pages@v5

      - name: Prepare Pages Artifact
        run: |
          mkdir -p _site
          cp apps/web/public/command-center-preview.html _site/index.html

      - name: Upload Artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: '_site'

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
