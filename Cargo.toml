[workspace]
resolver = "2"
members = [
    "crates/omni-core",
    "crates/omni-fraud-engine",
    "crates/omni-logistics",
    "crates/omni-ai",
    "crates/omni-db",
    "apps/server",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
authors = ["OmniCommerce AI Engineering"]
license = "Proprietary"

[workspace.dependencies]
tokio = { version = "1.40", features = ["full"] }
axum = { version = "0.7", features = ["macros", "ws", "multipart"] }
tower = { version = "0.5" }
tower-http = { version = "0.6", features = ["cors", "trace", "compression-gzip", "limit"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
uuid = { version = "1.10", features = ["v4", "v7", "serde"] }
chrono = { version = "0.4", features = ["serde"] }
thiserror = "1.0"
anyhow = "1.0"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }
sha2 = "0.10"
hmac = "0.12"
hex = "0.4"
base64 = "0.22"
reqwest = { version = "0.12", features = ["json", "rustls-tls"] }
async-trait = "0.1"
diesel = { version = "2.2", features = ["postgres", "uuid", "chrono", "numeric", "serde_json", "r2d2"] }
bigdecimal = { version = "0.4", features = ["serde"] }
dotenvy = "0.15"
