# ============================================================================
# OmniCommerce AI OS — Official Shopify App Store Configuration
# ============================================================================
name = "OmniCommerce AI OS & COD Fraud Shield"
client_id = "shopify_client_id_placeholder"
application_url = "https://app.omnicommerce.ai"
embedded = true

[access_scopes]
scopes = "read_orders,write_orders,read_products,write_fulfillments,read_customers"

[webhooks]
api_version = "2025-01"

  [[webhooks.subscriptions]]
  topics = [ "orders/create", "orders/updated" ]
  uri = "/api/v1/webhooks/shopify/orders-create"
